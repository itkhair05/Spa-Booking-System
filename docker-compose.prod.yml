# ==============================================================================
# TIKEY SPA — Production Docker Compose Override
# ==============================================================================
# Usage in production:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Production hardening overrides:
# - Completely removes any host port publishing for MySQL database service.
# - Backend and MySQL communicate exclusively through the private Docker network (spa-booking-network).
# ==============================================================================
services:
  mysql:
    ports: !reset []
