name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  git-diff-check:
    name: Git Diff Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check git diff
        run: git diff --check

  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: spabooking_dev
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x backend/mvnw

      - name: Run Backend Tests
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/spabooking_dev?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: root
          DB_PASSWORD: root
        run: ./mvnw test

  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-ci:
    name: Docker CI
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: ci_test_db_password_123
      DEV_OWNER_PASSWORD: ci_test_owner_password_123
      DEV_STAFF_PASSWORD: ci_test_staff_password_123
      JWT_SECRET: ci_test_jwt_secret_must_be_at_least_256_bits_long_example
      VNPAY_HASH_SECRET: ci_test_vnpay_hash_secret_example
      VNPAY_TMN_CODE: CI_TMN_CODE
      MYSQL_HOST_PORT: 3307
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker and Compose availability
        run: |
          docker --version
          docker compose version

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build Docker images
        run: docker compose build backend frontend

      - name: Start Compose services and verify health
        run: |
          docker compose up -d --wait --wait-timeout 180
          docker compose ps

      - name: Display service logs on failure
        if: failure()
        run: docker compose logs

      - name: Cleanup Compose services
        if: always()
        run: docker compose down
