# ==============================================================================
# TIKEY SPA — Spring Boot Production Profile Configuration
# ==============================================================================
# Activate with: SPRING_PROFILES_ACTIVE=prod or --spring.profiles.active=prod
# Strictly driven by environment variables. No fallback to dev or localhost.
# Never commit real credentials or secret values to version control.
# ==============================================================================
spring.config.activate.on-profile=prod

# Server & Graceful Shutdown
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}

# Database Configuration (Production — strictly driven by environment variables, NO localhost fallbacks)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool (Optimized for single-instance TIKEY SPA production)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=TikeySpaHikariPool

# JPA / Hibernate (Strict validation only; schema auto-generation and SQL printing disabled)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway Migrations (Authoritative schema management)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# JWT Security (Must be explicitly supplied via environment; minimum 256 bits)
jwt.secret=${JWT_SECRET}
jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}

# Multipart / File Upload Limits (aligned with 5MB application limit and 10MB Nginx limit)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${APP_UPLOAD_DIR:/app/uploads}

# CORS Allowed Origins (Must be explicitly supplied via environment; NO localhost fallbacks)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# VNPay Production Configuration (NO sandbox defaults; live endpoints by default)
vnpay.tmn-code=${VNPAY_TMN_CODE}
vnpay.hash-secret=${VNPAY_HASH_SECRET}
vnpay.payment-url=${VNPAY_PAYMENT_URL:https://vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNPAY_RETURN_URL}
vnpay.ipn-url=${VNPAY_IPN_URL:}
vnpay.refund-url=${VNPAY_REFUND_URL:https://vnpayment.vn/merchant_webapi/api/transaction}

# Security Rate Limiting
security.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}

# Production-safe Logging Defaults (INFO level; SQL query logging disabled)
logging.level.root=INFO
logging.level.com.example.spabooking=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
